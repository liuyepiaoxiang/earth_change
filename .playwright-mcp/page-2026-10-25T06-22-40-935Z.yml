          - generic [ref=f5e521]:
            - generic [ref=f5e522]: Popular Domain Extensions
            - generic [ref=f5e523]:
              - generic [ref=f5e525]:
                - generic [ref=f5e526]:
                  - img ".com"
                - generic [ref=f5e527]: The .com extension is one of the oldest open TLDs on the Internet. It was first used in 1985 and meant to represent commercial entities. It has since become the most used extension for all types of websites, including nonprofits, educational institutions, and individuals.
              - generic [ref=f5e529]:
                - generic [ref=f5e530]:
                  - img ".net"
                - generic [ref=f5e531]: This open TLD was first introduced in 1985 and was intended for organizations involved in networking technologies. The .net extension has since become the world's second most common general top-level domain extension after .com.
              - generic [ref=f5e533]:
                - generic [ref=f5e534]:
                  - img ".org"
                - generic [ref=f5e535]: This generic TLD extension was introduced in 1985 for organizations that didn't fit into other extensions. Although it is still primarily used by non-profits, communities, and open-source projects, it is an open TLD, and anyone can use it.
              - generic [ref=f5e537]:
                - generic [ref=f5e538]:
                  - img ".co"
                - generic [ref=f5e539]: The .co extension, introduced in 1991, is the Internet country-code top-level domain (ccTLD) assigned to Colombia. Despite this, many people do not associate it with the country and consider it similar to the .com extension. Consequently, Google treats .co as a generic top-level domain (gTLD). There are no restrictions, allowing anyone worldwide to register a .co domain.
              - generic [ref=f5e541]:
                - generic [ref=f5e542]:
                  - img ".xyz"
                - generic [ref=f5e543]: The .xyz extension launched in 2014 as a fresh, versatile option for individuals and organizations worldwide. As an open TLD, it's been embraced by startups, tech innovators, artists, and everyday users looking for a modern and memorable domain.
