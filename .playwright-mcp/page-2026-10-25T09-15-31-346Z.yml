    - region [ref=f10e370]:
      - generic [ref=f10e371]:
        - generic [ref=f10e372]:
          - generic [ref=f10e373]: 常见问题
          - heading "我们如何助力您的成功" [level=2] [ref=f10e374]
        - generic [ref=f10e375]:
          - article [ref=f10e376]:
            - button "最低起订量（MOQ）是多少？" [ref=f10e377] [cursor=pointer]
            - region "最低起订量（MOQ）是多少？":
              - generic [ref=f10e380]: 酒店和 OEM 产品——每个 SKU 50 件。电子商务和批发——每个 SKU 100 件。代发货计划——无最低限制，按件计价。1–3 件的样品订单随时按样品价格提供。
          - article [ref=f10e381]:
            - button "可以在下大订单前订购样品吗？" [ref=f10e382] [cursor=pointer]
            - region "可以在下大订单前订购样品吗？":
              - generic [ref=f10e385]: 是的。样品交期为 7–10 个工作日。运费由买方承担。对于符合条件的批量订单，样品费可以抵扣。我们建议同时测试多个软硬度选项。
          - article [ref=f10e386]:
            - button "OEM 定制包含哪些内容？" [ref=f10e387] [cursor=pointer]
            - region "OEM 定制包含哪些内容？":
              - generic [ref=f10e390]: 尺寸（标准、房车、游艇、酒店专用）、材料规格（弹簧类型、圈数、海绵密度/ILD）、软硬度级别、面料（标准或买方提供）、品牌标签（织标、印标、绣花）以及包装（定制纸箱或零售包装）。
          - article [ref=f10e391]:
            - button "生产交期是多少？" [ref=f10e392] [cursor=pointer]
            - region "生产交期是多少？":
              - generic [ref=f10e395]: 标准：30% 定金后 25–35 个工作日。2000+ 件可能需要 35–45 天。春节增加 10–14 天。第 7、14、21 天更新进度；可安排第三方出货前质检。
          - article [ref=f10e396]:
            - button "提供哪些物流方式？" [ref=f10e397] [cursor=pointer]
            - region "提供哪些物流方式？":
              - generic [ref=f10e400]: 海运整柜/拼柜（COSCO、Maersk、ZIM），快递（DHL、FedEx、顺丰），加急空运，Amazon FBA 直发。报价基于 FOB 广州/上海，可安排 CIF 和 DDP 或自行安排物流。
          - article [ref=f10e401]:
            - button "产品有哪些认证？" [ref=f10e402] [cursor=pointer]
            - region "产品有哪些认证？":
              - generic [ref=f10e405]: ISO 9001:2015（质量管理）、ISO 14001（环境管理）、OEKO-TEX Standard 100（面料与填充）、CertiPUR-US（凝胶记忆棉）、AAA 企业信用、QB/T 1952.2-2011（超国标 2.6 倍）。BS 5852、CFR 1633、SGS 和 BV 报告可按需提供。
          - article [ref=f10e406]:
            - button "付款方式是什么？" [ref=f10e407] [cursor=pointer]
            - region "付款方式是什么？":
              - generic [ref=f10e410]: 30% 定金 + 70% 发货前。接受 T/T、即期信用证、Western Union（样品）。默认美元，国内客户可用人民币。
          - article [ref=f10e411]:
            - button "我可以要求定制尺寸吗？" [ref=f10e412] [cursor=pointer]
            - region "我可以要求定制尺寸吗？":
              - generic [ref=f10e415]: 是的。SleepNova 支持选定项目和渠道订单的标准尺寸、欧标尺寸及定制尺寸。
          - article [ref=f10e416]:
            - button "你们提供卷包床垫选项吗？" [ref=f10e417] [cursor=pointer]
            - region "你们提供卷包床垫选项吗？":
              - generic [ref=f10e420]: 是的。选定型号支持真空卷包和盒装床垫解决方案。
          - article [ref=f10e421]:
            - button "我可以要求防火或凉感配置吗？" [ref=f10e422] [cursor=pointer]
            - region "我可以要求防火或凉感配置吗？":
              - generic [ref=f10e425]: 是的。我们可以根据酒店、项目或渠道需求推荐配置。
          - article [ref=f10e426]:
            - button "你们提供样品安排吗？" [ref=f10e427] [cursor=pointer]
            - region "你们提供样品安排吗？":
              - generic [ref=f10e430]: 是的。可以根据型号、尺寸和包装方向准备样品选项。
          - article [ref=f10e431]:
            - button "关于售后？" [ref=f10e432] [cursor=pointer]
            - region "关于售后？":
              - generic [ref=f10e435]: 具体以双方实际沟通确定后以合同的方式明确售后服务条款。
