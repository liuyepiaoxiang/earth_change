    - generic [ref=f10e316]:
      - generic [ref=f10e317]:
        - generic [ref=f10e318]: Why SleepNova
        - heading "Built for Long-Term Use, Not Short-Term Sales" [level=2] [ref=f10e319]
        - paragraph [ref=f10e320]: 30+ years of hotel mattress engineering means every material choice, every spring gauge, and every foam density is selected for real-world durability — not showroom impressions.
      - generic [ref=f10e321]:
        - generic [ref=f10e322]:
          - generic [ref=f10e323]: "01"
          - heading "80,000+ Cycle Durability" [level=3] [ref=f10e324]
          - paragraph [ref=f10e325]: 70# high-carbon steel springs undergo multi-temperature heat treatment, achieving 2.6× the national standard (QB/T 1952.2-2011 requires 30,000 cycles). This means years of consistent support even under high-rotation hotel use.
        - generic [ref=f10e326]:
          - generic [ref=f10e327]: "02"
          - heading "Zero Motion Transfer" [level=3] [ref=f10e328]
          - paragraph [ref=f10e329]: Each pocket spring operates independently, eliminating partner disturbance and noise during turning. Combined with high-density isolation pads and non-woven fabric layers, the sleep surface stays stable even on shared beds.
        - generic [ref=f10e330]:
          - generic [ref=f10e331]: "03"
          - heading "Full Custom Capability" [level=3] [ref=f10e332]
          - paragraph [ref=f10e333]: Non-standard sizes, firmness combinations, branded fabric covers, fire-retardant layers, and packaging — all customizable from 50 units. We support Twin to California King plus EU and custom dimensions.
        - generic [ref=f10e334]:
          - generic [ref=f10e335]: "04"
          - heading "200+ Hotel Brand Trust" [level=3] [ref=f10e336]
          - paragraph [ref=f10e337]: From Hilton and Marriott to Shangri-La and IHG — 200+ hotel brands and 30,000+ global hotel projects trust our products. This isn't marketing claim; it's decades of consistent delivery, quality, and repeat orders.
        - generic [ref=f10e338]:
          - generic [ref=f10e339]: "05"
          - heading "Fast Global Delivery" [level=3] [ref=f10e340]
          - paragraph [ref=f10e341]: 25–35 day production lead time. Sea freight (FCL/LCL via COSCO, Maersk, ZIM), air freight, and Amazon FBA direct shipping. FOB Guangzhou/Shanghai standard, CIF and DDP available on request.
        - generic [ref=f10e342]:
          - generic [ref=f10e343]: "06"
          - heading "Certified Quality System" [level=3] [ref=f10e344]
          - paragraph [ref=f10e345]: ISO 9001 quality management, ISO 14001 environmental management, OEKO-TEX Standard 100, CertiPUR-US, and AAA enterprise credit rating. Every mattress passes full-cycle QC from spring to packaging.
